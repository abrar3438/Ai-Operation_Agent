[project]
name = "ai-operations-agent-api"
version = "0.1.0"
description = "AI Operations Agent API (TASK-001 foundation)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "AI Operations Agent" }]
dependencies = [
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.30,<0.36",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.0,<6",
    "alembic>=1.13,<1.17",
    "httpx>=0.27,<0.29",
    "langgraph>=1.2.14",
    "langgraph-checkpoint>=4.2.0",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.7,<0.15",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 0
